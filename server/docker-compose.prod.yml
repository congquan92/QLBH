version: "3.9"

services:
  # Service chạy code Laravel
  app:
    build: .
    container_name: shopzues-app
    restart: always
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    # Railway/Render sẽ tự động map PORT, nhưng nếu dùng VPS riêng thì thêm:
    # ports:
    #   - "80:8000"
    depends_on:
      - db
      - redis

  redis:
    image: redis:alpine # Bản alpine nhẹ hơn, tiết kiệm tài nguyên Cloud
    restart: always

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD} # Dùng biến môi trường cho bảo mật
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-prod-data:/var/lib/mysql

volumes:
  db-prod-data: